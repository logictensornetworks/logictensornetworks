[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ltn"
version = "2.2"
authors = [
  {name="Samy Badreddine", email="badreddine.samy@gmail.com"},
]
description = "Logic Tensor Networks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    # tensorflow ships Apple Silicon wheels since 2.13; tensorflow-macos is discontinued
    "tensorflow>=2.15",
]
keywords=["machine-learning","framework","neural-symbolic-computing","fuzzy-logic","tensorflow"]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/logictensornetworks/logictensornetworks"
"Issue Tracker" = "https://github.com/logictensornetworks/logictensornetworks/issues"

[project.optional-dependencies]
examples = [
    "matplotlib",
    "networkx",
    "pandas",
    "seaborn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
include = ["ltn"]

[tool.ruff]
line-length = 100
extend-exclude = ["examples", "tutorials"]  # Scratch code and notebooks

[tool.ruff.lint]
# A small rule set on purpose: pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E731",  # Allow lambda assignments
]
