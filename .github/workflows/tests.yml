name: tests

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    # weekly, to catch breaking TensorFlow/Keras releases
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
    # Only the dev group (pytest, ruff), pinned by uv.lock: no need for TensorFlow to lint.
    - name: Install ruff
      run: uv sync --locked --only-dev
    - name: Lint
      run: uv run --no-sync ruff check .
    - name: Format
      run: uv run --no-sync ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        tensorflow: ["latest"]
        os: [ubuntu-latest]
        include:
          # last release with Keras 2
          - python-version: "3.11"
            tensorflow: "2.15.*"
            os: ubuntu-latest
          # Apple Silicon, to catch platform-specific packaging issues:
          # newest Python with latest TF, and the oldest supported TF (Keras 2)
          - python-version: "3.13"
            tensorflow: "latest"
            os: macos-latest
          - python-version: "3.11"
            tensorflow: "2.15.*"
            os: macos-latest

    # ubuntu jobs keep their pre-matrix names so required status checks still match
    name: python ${{ matrix.python-version }}, tensorflow ${{ matrix.tensorflow }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }}
    steps:
    - uses: actions/checkout@v5
    # setup-uv publishes no moving major tag (like v10) since v8: pin the exact version
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    # Resolve fresh versions instead of installing uv.lock, so new TensorFlow/Keras
    # releases are tested as soon as they are out.
    - name: Install dependencies
      run: |
        tensorflow="tensorflow"
        if [ "${{ matrix.tensorflow }}" != "latest" ]; then
          tensorflow="tensorflow==${{ matrix.tensorflow }}"
        fi
        uv pip install -e . --group dev "$tensorflow"
        python -c "import tensorflow as tf, keras; print('tensorflow', tf.__version__, '| keras', keras.__version__)"
    - name: Run tests
      run: python -m pytest test -v
