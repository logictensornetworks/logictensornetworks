name: tests

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    # weekly, to catch breaking TensorFlow/Keras releases
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        tensorflow: ["latest"]
        include:
          # last release with Keras 2
          - python-version: "3.11"
            tensorflow: "2.15.*"

    name: python ${{ matrix.python-version }}, tensorflow ${{ matrix.tensorflow }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.tensorflow }}" != "latest" ]; then
          python -m pip install "tensorflow==${{ matrix.tensorflow }}"
        fi
        python -m pip install -e . pytest
        python -c "import tensorflow as tf, keras; print('tensorflow', tf.__version__, '| keras', keras.__version__)"
    - name: Run tests
      run: python -m pytest test -v
